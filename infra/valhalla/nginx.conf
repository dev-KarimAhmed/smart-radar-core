# CORS front for the self-hosted Valhalla instance.
#
# Required because the rider's BROWSER calls Valhalla directly (the app's default,
# load-spreading path in src/lib/road-route.ts) and valhalla_service itself sends no
# Access-Control-Allow-Origin header — without this proxy every browser call would be
# blocked by CORS and silently fall through to the public OSRM router.

server {
    listen 80;

    location / {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Accept" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://valhalla:8002;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
}
